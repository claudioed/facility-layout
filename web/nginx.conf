# facility_mfe static runtime.
#
# The Nginx web gateway (warehouse-infra) strips the public /mfes/facility-layout
# prefix before proxying here, so this server sees root-relative paths:
# a browser request for /mfes/facility-layout/remoteEntry.js arrives as
# /remoteEntry.js. The built assets themselves still carry the public prefix in
# their URLs because Vite's `base` is /mfes/facility-layout/ -- that is what
# keeps this remote's chunks in their own namespace at the shared origin.
#
# No API is proxied from here. This pod serves bytes only; every API call the
# SPA makes goes straight to Kong on its own host port.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Terminates at this pod -- used by the Kubernetes probes, never routed
    # through the web gateway.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The federation entrypoint is a stable, unhashed filename: the shell
    # re-fetches it on every load to discover the current chunk graph. Caching
    # it would pin a browser to a deleted chunk set after a redeploy.
    location = /remoteEntry.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Standalone-mode entry document. Same reasoning as remoteEntry.js.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # NOTE: no `expires` directive here. `expires 1y` emits its OWN
    # Cache-Control: max-age=... header, which combined with the add_header
    # below sends TWO Cache-Control headers on every asset response. Setting
    # max-age inside the single add_header keeps the response unambiguous.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Standalone development/preview of this remote on its own: unknown paths
    # fall back to the SPA so client-side routing works without the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

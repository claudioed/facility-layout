# Default values for facility-layout.

replicaCount: 1

image:
  repository: claudioed/facility-layout
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: facility-layout.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Falls back to the in-memory adapters + log-only event publishing when
# database.url is left empty, same as running the binary locally with no env
# vars set. migrationsPath is resolved inside the image, where the Dockerfile
# copies /migrations next to the binary.
config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  # Selects the outbound EventPublisher (ADR-0009): "log" (default) keeps the
  # Postgres outbox/log publisher; "kafka" additionally fans out to the
  # integration topic AND, when analytics.enabled, the analytics topic that
  # the projector consumes. Existing default behavior is unchanged.
  eventPublisher: "log"   # "log" or "kafka"

# OpenTelemetry. The service pushes traces, metrics and logs over OTLP/gRPC
# to a Collector; nothing is scraped from the pod. A Collector that is down
# or absent is harmless — the exporters are non-blocking and telemetry is
# simply dropped — so this can stay enabled in every environment.
otel:
  enabled: true
  # Either "host:port" or a full URL; the service accepts both. The URL
  # form is what the OTel SDK's own env-var convention expects.
  endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  serviceName: "facility-layout"

# Reported as the deployment.environment.name resource attribute on every
# span, metric and log record, so one Collector can serve several
# environments without them being confused for each other.
environment: "local"

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

kafka:
  enabled: false
  brokers: "kafka:9092"

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0010) ---
# The "Layout Catalog Growth & Change" report: a separate analytics topic, a
# writer (projector) and a read-only reader (reports), backed by a separate
# analytical database. Disabled by default so existing releases are
# unaffected; set analytics.enabled=true to deploy the two extra processes.
# Requires config.eventPublisher / kafka.enabled=true on the main deployment
# too, or the projector's Kafka topic never receives events to consume.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

{{- if and .Values.mcp.enabled (not .Values.mcp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "facility-layout.mcpSecretName" . }}
  labels:
    {{- include "facility-layout.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  # Static bearer keys (ADR-0007). An empty key is ignored by the binary, so
  # leaving both blank deploys a server that rejects every request (fail
  # closed) rather than one that is open to everyone.
  MCP_READ_KEY: {{ .Values.mcp.readKey | quote }}
  MCP_READWRITE_KEY: {{ .Values.mcp.readWriteKey | quote }}
{{- end }}

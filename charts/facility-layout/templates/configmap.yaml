apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "facility-layout.fullname" . }}
  labels:
    {{- include "facility-layout.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  MIGRATIONS_PATH: {{ .Values.config.migrationsPath | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  {{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
